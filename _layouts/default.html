<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% if page.thumbnail %}
    <meta property="og:type" content="{% if page.collection == 'posts' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url | escape }}">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:image" content="{{ page.thumbnail | absolute_url | escape }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ page.title | default: site.title | escape }}">
    <meta name="twitter:card" content="summary_large_image">
    {% endif %}
    <meta name="theme-color" content="#1c1c1f">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/teaser.css' | relative_url }}">
  </head>
  <body class="teaser-page {{ page.body_class | default: layout.body_class }}">
    {{ content }}
    {% include footer.html %}
  </body>
</html>
